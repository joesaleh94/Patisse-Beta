<title>Patisse</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=Poiret+One&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
--rose:#C4A295;--roseBtn:#886B5E;--rp:#F5EBE7;--rt:#9E7A6E;--bg:#fff;--txt:#1A1714;--sub:#6B6764;--bdr:#F0EBE5;
}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--txt);color:#fff;font-family:var(--ff);font-size:13px;font-weight:500;padding:12px 20px;border-radius:30px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:150;opacity:0;transition:opacity .3s ease,transform .3s ease;max-width:86%;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.fbtxt{width:100%;min-height:110px;border-radius:14px;border:1.5px solid var(--bdr);padding:12px 14px;font-family:var(--ff);font-size:14px;resize:none;box-sizing:border-box;color:var(--txt)}
.fbtxt:focus{outline:none;border-color:var(--rose)}
:root{
--ff:'Cormorant Garamond',Georgia,serif;--logo:'Poiret One',sans-serif;--cin:'Cinzel',serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:var(--ff);background:var(--bg);color:var(--txt);overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative;overflow:hidden}
.scr{display:none;flex-direction:column;height:100%;overflow:hidden;position:absolute;inset:0;background:#fff;z-index:1}
.scr.active{display:flex;z-index:2}
.ss{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
img{display:block;width:100%;object-fit:cover}
.nav{display:flex;justify-content:space-around;padding:6px 0 env(safe-area-inset-bottom,12px);border-top:1px solid var(--bdr);flex-shrink:0;background:#fff}
.ni{text-align:center;cursor:pointer;padding:6px 0;flex:1;transition:color .15s}
.ni.on{color:var(--rose)}.ni.off{color:#C8C0B8}
.ni svg{display:block;margin:0 auto 2px}.ni span{font-size:10px;font-weight:600}
.btn{display:block;text-align:center;cursor:pointer;border:none;font-family:var(--ff);transition:all .12s;letter-spacing:.02em}
.bp{background:var(--roseBtn);color:#fff;padding:14px;border-radius:14px;font-size:15px;font-weight:600}
.bo{background:transparent;border:1.5px solid var(--rose);color:var(--txt);padding:14px;border-radius:14px;font-size:15px;font-weight:600}
.bs{padding:10px 18px;font-size:13px}.bd{background:#E8E4DF;color:#B8B0A8;cursor:default}
.chip{display:inline-block;padding:7px 14px;border-radius:22px;font-size:13px;font-weight:600;cursor:pointer;border:1.5px solid var(--bdr);background:#fff;color:var(--txt);transition:all .12s}
.chip.on{background:var(--roseBtn);color:#fff;border-color:var(--rose)}
.dv{height:1px;background:var(--bdr);margin:0 18px}
.cutoff{font-size:12px;color:var(--rt);text-align:center;padding:7px 12px;border-radius:8px;background:var(--rp);font-weight:500}
.cutoff b{font-weight:700}
.ab{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;cursor:pointer;flex-shrink:0;border:none;transition:all .12s}
.ab.add{background:var(--roseBtn);color:#fff}.ab.done{background:#F0E8E4;color:var(--rt)}.ab.dis{background:#F0EBE5;color:#D6C4B0;cursor:default}
.tog{flex:1;padding:12px;border-radius:14px;text-align:center;cursor:pointer;transition:all .12s}
.tog.on{border:2px solid var(--rose);background:var(--rp)}.tog.off{border:1.5px solid var(--bdr);background:#fff}
@keyframes bounce{from{transform:translateY(0)}to{transform:translateY(-4px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fi{animation:fadeIn .3s ease-out}
#splash{position:fixed;inset:0;z-index:100;background:#1A1714;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s ease,visibility .8s ease}
#splash.out{opacity:0;visibility:hidden}
#splash-img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease;filter:brightness(0.7)}
#splash-img.show{opacity:1}
#splash-overlay{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(26,23,20,.2) 0%,rgba(26,23,20,.7) 100%);z-index:1}
#splash-content{position:relative;z-index:2;text-align:center;opacity:0;transform:translateY(20px);transition:opacity 1s ease .6s,transform 1s ease .6s}
#splash-content.show{opacity:1;transform:translateY(0)}
#splash-tagline{opacity:0;transform:translateY(10px);transition:opacity .8s ease 1.4s,transform .8s ease 1.4s}
#splash-tagline.show{opacity:1;transform:translateY(0)}
#splash-enter{opacity:0;transition:opacity .6s ease 2s}
#splash-enter.show{opacity:1}
</style>
</head>
<body>

function go(s,o){
if(s==='back'){if(S.history.length)S.screen=S.history.pop();else S.screen='home';render();return}
S.history.push(S.screen);
if(o){
  if(o.box){S.boxType=o.box;S.mode=o.box==='custom'?'custom':'box';
    if(o.box!=='custom'){var b=BOXES.find(function(x){return x.id===o.box});S.sel=P.filter(function(p){return p.a}).slice(0,Math.min(4,b.c)).map(function(p){return p.id})}
    else S.sel=[];
  }
  if(o.type)S.orderType=o.type;
  if(o.mode)S.mode=o.mode;
}
if(s==='products'&&!S.boxChosen&&!(o&&o.box))S.sel=[];
S.screen=s;render();
var el=document.querySelector('.scr.active .ss');if(el)el.scrollTop=0;
}
function toggle(id){
var b=getBox();
if(S.sel.includes(id)){S.sel=S.sel.filter(function(x){return x!==id})}
else if(S.mode==='custom'||S.sel.length<b.c){S.sel.push(id)}
render();
}
function toggleProd(id){
if(S.screen==='products'&&!S.boxChosen){showBoxModal(id);return}
toggle(id);
}

/* ══════ PRODUCTS ══════ */
function screenProducts(){
var b=getBox();
var h='<div style="padding:12px 18px 10px;border-bottom:1px solid var(--bdr);flex-shrink:0">';
h+='<div style="font-size:26px;font-weight:400">Products</div>';
h+='<div style="font-size:12px;color:var(--sub);margin-top:2px;margin-bottom:6px;font-weight:300;font-style:italic">This week\'s selection</div>';
h+='<div class="cutoff" style="margin-bottom:10px">Orders must be placed by <b>Wednesday 12:00 PM</b> for Friday delivery</div>';
if(S.sel.length>0){h+='<div style="background:var(--rp);border:1.5px solid #E8D5CC;border-radius:12px;padding:10px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:13px;font-weight:600;color:var(--rt)">Building: '+b.n+'</div><div style="font-size:11px;color:var(--sub);margin-top:2px;font-weight:300">'+S.sel.length+(S.boxType!=='custom'?' of '+b.c:'')+' items</div></div>';
h+='<div style="display:flex;flex-direction:column;align-items:flex-end;gap:7px">';if(S.boxType!=='custom'){h+='<div style="display:flex;gap:3px">';for(var i=0;i<b.c;i++)h+='<div style="width:8px;height:8px;border-radius:4px;background:'+(i<S.sel.length?'var(--rose)':'var(--bdr)')+'"></div>';h+='</div>';}h+='<span onclick="changeBox()" style="font-size:12px;font-weight:600;color:var(--rose);cursor:pointer">Change</span></div>';
h+='</div>';}
var cats=["All","Artisan Loaves","Specialty","Buns","Breakfast Loaves"];
h+='<div style="display:flex;gap:6px;flex-wrap:wrap">';
cats.forEach(function(c){h+='<div class="chip '+(S.filter===c?'on':'')+'" onclick="S.filter=\''+c+'\';render()">'+c+'</div>'});
h+='</div></div>';
h+='<div class="ss" style="padding:0 18px">';
var filtered=S.filter==='All'?P:P.filter(function(p){return p.c===S.filter});
var staples=filtered.filter(function(p){return p.grp==='staple'});
var features=filtered.filter(function(p){return p.grp==='feature'});
if(staples.length){h+='<div style="font-size:18px;font-weight:600;padding:16px 0 4px;color:var(--rt)">'+stapleName()+'</div><div style="font-size:11px;color:var(--sub);margin-bottom:4px;font-weight:300;font-style:italic">Available every week</div>';staples.forEach(function(p){h+=prodCard(p,true)})}
if(features.length){h+='<div style="font-size:18px;font-weight:600;padding:20px 0 4px;color:var(--rt)">'+featureName()+'</div><div style="font-size:11px;color:var(--sub);margin-bottom:4px;font-weight:300;font-style:italic">Rotating selection</div>';features.forEach(function(p){h+=prodCard(p,true)})}
h+='<div style="height:14px"></div></div>';h+=navH('products');return h;
}

/* ══════ AI ASSISTANT ══════ */
function screenAssistant(){
var h='<div style="padding:12px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bdr);flex-shrink:0"><span style="cursor:pointer" onclick="go(\'back\')">'+ICO.back+'</span><div style="flex:1"><div style="font-size:20px;font-weight:500">Bread Assistant</div><div style="font-size:11px;color:var(--sub);margin-top:1px;font-weight:300;font-style:italic">Tell me what you\'re looking for</div></div><div style="width:32px;height:32px;border-radius:10px;background:var(--roseBtn);display:flex;align-items:center;justify-content:center">'+ICO.bolt+'</div></div>';
h+='<div class="ss" style="padding:16px 18px" id="chat-area"><div style="display:flex;gap:10px;margin-bottom:14px"><div style="width:32px;height:32px;border-radius:10px;background:var(--roseBtn);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px">'+ICO.bolt+'</div><div style="flex:1;background:var(--rp);border-radius:0 16px 16px 16px;padding:14px 16px"><div style="font-size:14px;line-height:1.5">Hi! I\'m your Patisse assistant. Tell me what you\'re looking for and I\'ll help build the perfect box.</div><div style="margin-top:10px">';
h+='<div onclick="sendMsg(\'I need bread for sandwiches and something sweet\')" style="font-size:13px;color:var(--rose);font-weight:600;cursor:pointer;padding:8px 12px;background:#fff;border-radius:10px;border:1px solid var(--bdr);margin-bottom:6px">"I need bread for sandwiches and something sweet"</div>';
h+='<div onclick="sendMsg(\'What is good for a weekend brunch?\')" style="font-size:13px;color:var(--rose);font-weight:600;cursor:pointer;padding:8px 12px;background:#fff;border-radius:10px;border:1px solid var(--bdr);margin-bottom:6px">"What\'s good for a weekend brunch?"</div>';
h+='<div onclick="sendMsg(\'Build me a box for a family of four\')" style="font-size:13px;color:var(--rose);font-weight:600;cursor:pointer;padding:8px 12px;background:#fff;border-radius:10px;border:1px solid var(--bdr);margin-bottom:6px">"Build me a box for a family of four"</div>';
h+='</div></div></div></div>';
h+='<div style="padding:8px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--bdr);flex-shrink:0;display:flex;gap:8px;align-items:center"><input type="text" id="chat-input" placeholder="Tell me what you\'re looking for..." style="flex:1;border:1.5px solid var(--bdr);border-radius:14px;padding:12px 16px;font-size:14px;font-family:var(--ff);color:var(--txt);outline:none" onkeypress="if(event.key===\'Enter\')sendFromInput()"><div onclick="sendFromInput()" style="width:42px;height:42px;border-radius:14px;background:var(--roseBtn);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0">'+ICO.send+'</div></div>';
return h;
}

function sendMsg(text){
var area=document.getElementById('chat-area');if(!area)return;
area.innerHTML+='<div style="display:flex;justify-content:flex-end;margin-bottom:14px" class="fi"><div style="background:var(--txt);color:#fff;border-radius:16px 0 16px 16px;padding:12px 16px;max-width:78%;font-size:14px;line-height:1.5">'+text+'</div></div>';
area.innerHTML+='<div id="typing" style="display:flex;gap:10px;margin-bottom:14px"><div style="width:32px;height:32px;border-radius:10px;background:var(--roseBtn);display:flex;align-items:center;justify-content:center;flex-shrink:0">'+ICO.bolt+'</div><div style="background:var(--rp);border-radius:0 16px 16px 16px;padding:12px 16px"><div style="display:flex;gap:4px"><div style="width:6px;height:6px;border-radius:3px;background:var(--roseBtn);animation:bounce .6s infinite alternate"></div><div style="width:6px;height:6px;border-radius:3px;background:var(--roseBtn);animation:bounce .6s .2s infinite alternate"></div><div style="width:6px;height:6px;border-radius:3px;background:var(--roseBtn);animation:bounce .6s .4s infinite alternate"></div></div></div></div>';
area.scrollTop=area.scrollHeight;
setTimeout(function(){var el=document.getElementById('typing');if(el)el.remove();var r='',t=text.toLowerCase();
if(t.includes('sandwich')||t.includes('sweet')){r='<div style="font-size:14px;line-height:1.5;margin-bottom:12px">Great choice! For sandwiches, our <b>Sourdough Loaf</b> is the most popular. For something sweet, try the <b>Blueberry Breakfast Loaf</b>.</div>';r+=recCard([1,2,6,4,7,3])}
else if(t.includes('brunch')){r='<div style="font-size:14px;line-height:1.5;margin-bottom:12px">For a weekend brunch spread:</div>';r+=recCard([4,7,1,6,9,10])}
else if(t.includes('family')){r='<div style="font-size:14px;line-height:1.5;margin-bottom:12px">For a family of four, <b>The Baker\'s Box</b> (6 items) gives variety all week:</div>';r+=recCard([1,2,6,4,7,11])}
else{r='<div style="font-size:14px;line-height:1.5;margin-bottom:12px">Here\'s my recommendation based on what you\'re looking for:</div>';r+=recCard([1,4,7,6,2,9])}
area.innerHTML+='<div style="display:flex;gap:10px;margin-bottom:14px" class="fi"><div style="width:32px;height:32px;border-radius:10px;background:var(--roseBtn);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px">'+ICO.bolt+'</div><div style="flex:1;background:var(--rp);border-radius:0 16px 16px 16px;padding:14px 16px">'+r+'</div></div>';
area.scrollTop=area.scrollHeight},1200);
}
function recCard(ids){var h='<div style="background:#fff;border-radius:14px;padding:12px;border:1px solid var(--bdr)"><div style="font-size:12px;font-weight:600;color:var(--rose);margin-bottom:8px">Recommended box · $30.99</div>';
ids.forEach(function(id){var p=P.find(function(x){return x.id===id});if(p)h+='<div style="display:flex;align-items:center;gap:8px;padding:4px 0"><div style="width:32px;height:32px;border-radius:8px;overflow:hidden">'+pi(p.i,'32px','32px')+'</div><div style="flex:1;font-size:12px;font-weight:500">'+p.n+'</div><span style="font-size:12px;font-weight:600;color:var(--sub)">$'+p.p.toFixed(2)+'</span></div>'});
h+='<div class="btn bp bs" style="margin-top:10px;width:100%">Add this box to cart</div></div>';return h}
function sendFromInput(){var i=document.getElementById('chat-input');if(i&&i.value.trim()){sendMsg(i.value.trim());i.value=''}}

function render(){
var fns={home:screenHome,builder:screenBuilder,checkout:screenCheckout,confirm:screenConfirm,welcome:screenWelcome,products:screenProducts,assistant:screenAssistant};
document.getElementById('app').innerHTML='<div class="scr active">'+(fns[S.screen]||screenHome)()+'</div>';
}

function dismissSplash(){
document.getElementById('splash').classList.add('out');
document.getElementById('app').style.display='';
render();
setTimeout(function(){var s=document.getElementById('splash');if(s)s.remove()},900);
}

});
